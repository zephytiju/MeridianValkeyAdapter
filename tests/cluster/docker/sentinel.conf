# SPDX-License-Identifier: Apache-2.0
port 26379
bind 0.0.0.0
protected-mode no
requirepass meridian-test-password
sentinel monitor meridian-cache primary 6379 2
sentinel auth-user meridian-cache default
sentinel auth-pass meridian-cache meridian-test-password
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
sentinel down-after-milliseconds meridian-cache 1000
sentinel failover-timeout meridian-cache 10000
sentinel parallel-syncs meridian-cache 1
