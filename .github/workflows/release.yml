# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-build-isolation --no-deps .
      - run: ./scripts/verify.sh
      - run: ./scripts/test-integration.sh
      - run: ./scripts/test-failover.sh
      - name: Build release artifacts
        run: |
          rm -rf dist
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" python -m build --no-isolation
          python -m twine check dist/*
          python scripts/generate-release-evidence.py
          sha256sum dist/* evidence/release-evidence.json > checksums.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@v4
        with:
          name: meridian-storage-valkey-${{ github.ref_name }}
          path: |
            dist/*
            checksums.txt
            evidence/release-evidence.json
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* checksums.txt
          evidence/release-evidence.json --verify-tag --generate-notes
      - name: Publish to PyPI with trusted identity
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
